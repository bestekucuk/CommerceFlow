spring:
  application:
    name: pricing-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/pricing_db}
    username: ${DB_USER:pricing_service}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true
  jackson:
    # money and quantities are integers: 1299.99 or "12" must be rejected, not truncated/coerced
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

server:
  port: ${PORT:8086}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

commerceflow:
  pricing:
    # how long a quote's prices are guaranteed (ISO-8601 duration)
    quote-ttl: ${QUOTE_TTL:PT15M}
