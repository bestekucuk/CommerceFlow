spring:
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/product_db}
    username: ${DB_USER:product_service}
    password: ${DB_PASSWORD:}
  flyway:
    # In Compose/Kubernetes migrations run as a separate job with the migrator role
    # (FLYWAY_ENABLED=false); tests and local bootRun migrate at startup.
    enabled: ${FLYWAY_ENABLED:true}
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

commerceflow:
  schema-registry:
    url: ${SCHEMA_REGISTRY_URL:http://localhost:8090}

server:
  port: ${PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
