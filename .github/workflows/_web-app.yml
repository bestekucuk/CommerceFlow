# Reusable CI for one React + TypeScript app. Shares CI steps only, never code: the app
# builds from its own folder with its own package-lock.json.
name: web-app

on:
  workflow_call:
    inputs:
      app:
        description: Folder name under apps/
        type: string
        required: true

permissions:
  contents: read

jobs:
  build-test:
    name: typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/${{ inputs.app }}/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  image:
    name: image build
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed; no registry configured yet)
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ inputs.app }}
          push: false
          tags: commerceflow/${{ inputs.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}
