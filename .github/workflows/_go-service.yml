# Reusable CI for one Go service. Shares CI steps only, never code: the service is its
# own Go module and builds from its own folder with its own Makefile.
name: go-service

on:
  workflow_call:
    inputs:
      service:
        description: Folder name under services/
        type: string
        required: true

permissions:
  contents: read

jobs:
  build-test:
    name: lint, unit + integration tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ inputs.service }}/go.mod
          cache-dependency-path: services/${{ inputs.service }}/go.sum
      - name: Lint (go vet, gofmt)
        run: make lint
      - name: Unit tests (race detector)
        run: make test
      # Testcontainers (Docker on the runner)
      - name: Integration tests
        run: make integration
      - name: Build
        run: make build

  image:
    name: image build
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed; no registry configured yet)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service }}
          build-contexts: contracts=contracts
          push: false
          tags: commerceflow/${{ inputs.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
